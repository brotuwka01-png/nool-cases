<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NOOL CASES</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:sans-serif;
}

body{
background:#050510;
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
overflow:hidden;
}

.bg{
position:absolute;
width:500px;
height:500px;
background:#00ffd5;
filter:blur(200px);
opacity:.2;
border-radius:50%;
}

.container{
position:relative;
z-index:2;
text-align:center;
width:100%;
padding:20px;
}

.title{
font-size:42px;
font-weight:900;
margin-bottom:20px;
color:#00ffd5;
text-shadow:0 0 20px #00ffd5;
}

.wheel-box{
margin:auto;
width:320px;
height:120px;
overflow:hidden;
border:3px solid #00ffd5;
border-radius:25px;
background:#111122;
position:relative;
box-shadow:0 0 30px rgba(0,255,213,.4);
}

.pointer{
position:absolute;
left:50%;
top:0;
transform:translateX(-50%);
width:4px;
height:120px;
background:#00ffd5;
z-index:10;
}

.wheel{
display:flex;
position:absolute;
left:0;
top:0;
height:100%;
align-items:center;
transition:5s cubic-bezier(.1,.7,.1,1);
}

.item{
min-width:110px;
font-size:38px;
}

.btn{
margin-top:30px;
padding:18px 35px;
border:none;
border-radius:20px;
background:#00ffd5;
color:black;
font-size:20px;
font-weight:bold;
cursor:pointer;
box-shadow:0 0 20px rgba(0,255,213,.5);
}

.result{
margin-top:25px;
font-size:26px;
font-weight:bold;
}

</style>

</head>

<body>

<div class="bg"></div>

<div class="container">

<div class="title">
🎰 NOOL CASES
</div>

<div class="wheel-box">

<div class="pointer"></div>

<div class="wheel" id="wheel">

<div class="item">❌</div>
<div class="item">❌</div>
<div class="item">🐻</div>
<div class="item">❌</div>
<div class="item">❤️</div>
<div class="item">❌</div>
<div class="item">❌</div>
<div class="item">❌</div>
<div class="item">🐻</div>
<div class="item">❌</div>
<div class="item">❤️</div>
<div class="item">❌</div>

</div>

</div>

<button class="btn" onclick="openCase()">
ОТКРЫТЬ ЗА 15 ⭐
</button>

<div class="result" id="result"></div>

</div>

<script>

const wheel = document.getElementById("wheel")
const result = document.getElementById("result")

function openCase(){

result.innerHTML = "🎰 Крутится..."

const items = [
"❌",
"❌",
"❌",
"🐻",
"❌",
"❤️",
"❌",
"❌"
]

const random = Math.floor(Math.random() * items.length)

const position = -(random * 110) - 400

wheel.style.transition = "none"
wheel.style.transform = "translateX(0px)"

setTimeout(() => {

wheel.style.transition = "5s cubic-bezier(.1,.7,.1,1)"
wheel.style.transform = `translateX(${position}px)`

},100)

setTimeout(() => {

result.innerHTML = `🎉 Выпало: ${items[random]}`

},5500)

}

</script>

</body>

</html>
